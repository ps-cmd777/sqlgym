name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Grader unit tests
        run: npm test

      - name: Validate all 70 canonical solutions (both dataset variants)
        run: npm run validate

      - name: Production build
        run: npm run build
